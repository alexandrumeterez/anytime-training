save_num_unsharded_checkpoints_to_keep: 25
custom_checkpoint_saving_list: [12500, 25000, 50000, 100000, 200000, 400000,10000, 20000, 40000, 80000, 160000, 320000, 11250, 22500, 45000, 90000, 180000, 360000]
