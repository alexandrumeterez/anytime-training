# 18 jobs 
sweep:
  - device_train_microbatch_size: 32
    global_train_batch_size: 512
    wandb:
      group: 8x_anytime_large_batch
    optimizer:
      name: adamw
      learning_rate: [3.0e-3, 1.0e-2]
      beta_0: 0.9
      beta_1: [0.95, 0.98]
      eps: 1.0e-8
      decouple_weight_decay: false
      weight_decay: 0.0
      decay_norm_and_bias: true
      decay_embeddings: true
      metrics_log_interval: 100
    model:
      use_ema: true
    scheduler:
      name: ['inverse_sqrt_with_warmup']
      t_warmup: 2500
      offset: [800, 1600, 3200, 6400]
    max_duration: 50000
    stop_at: 50000

