# 18 jobs 
sweep:
  - device_train_microbatch_size: 32
    save_interval_unsharded: 625
    num_passes: 1
    wandb:
      group: chinchilla_32x
    optimizer:
      name: adamw
      learning_rate: 3.0e-4
      beta_0: 0.9
      beta_1: [0.95, 0.98, 0.99]
      eps: 1.0e-8
      decouple_weight_decay: false
      weight_decay: 0.0
      decay_norm_and_bias: true
      decay_embeddings: true
      metrics_log_interval: 100
    model:
      use_ema: false
    scheduler:
      name: "cosine_with_warmup"
      t_warmup: 5000
    max_duration: 12500
    stop_at: 12500 #1x chinchilla
