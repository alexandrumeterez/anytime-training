# 18 jobs 
sweep:
  - device_train_microbatch_size: 32
    wandb:
      group: 8x_anytime_second_sweep
    optimizer:
      name: adamw
      learning_rate: [3.0e-3, 1.0e-2]
      beta_0: 0.9
      beta_1: [0.98, 0.99]
      eps: 1.0e-8
      decouple_weight_decay: false
      weight_decay: 0.0
      decay_norm_and_bias: true
      decay_embeddings: true
      metrics_log_interval: 100
    model:
      use_ema: true
    scheduler:
      name: ['inverse_sqrt_with_warmup']
      t_warmup: 5000
      offset: [25600]
    max_duration: 100000
    stop_at: 100000

